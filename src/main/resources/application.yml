# ─────────────────────────────────────────────────────────────
# 공통 설정 — 프로파일로 환경 차이를 표현한다
#   API 키는 환경변수로만 주입한다. 소스에 절대 적지 않는다.
#   키가 없어도 기동은 된다(기동은 된다) — 호출할 때 401 로 드러난다.
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: helpdesk-ai

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:5434/springai
    username: springai
    password: springai

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true      # data.sql 을 테이블 생성 뒤에 실행
    open-in-view: false
    properties:
      hibernate.format_sql: true

  sql:
    init:
      mode: always
      platform: postgresql      # data-postgresql.sql 을 읽는다

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-set}    # 자리표시자 — 없으면 호출 시 401
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small        # 1536 차원 (임베딩 모델 설정 누락은 검색이 조용히 비는 원인이 된다)

    vectorstore:
      pgvector:
        initialize-schema: true                # 테이블 자동 생성
        dimensions: 1536                       # 임베딩 모델과 반드시 일치 (불일치하면 저장 시점에 오류 또는 엉뚱한 결과)
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always          # 대화 이력 테이블 자동 생성
            # 기본 스키마의 conversation_id 는 VARCHAR(36) 이다. 우리 대화 ID 는
            # {테넌트}:{계정}:{세션} 형식이라 더 길어서 폭을 넓힌 스크립트를 쓴다.
            schema: classpath:schema/chat-memory-postgresql.sql

# ─────────────────────────────────────────────────────────────
# 우리 서비스 설정 — 코드에 상수를 남기지 않는다 (코드에 상수를 남기지 않는다)
# ─────────────────────────────────────────────────────────────
helpdesk:
  rag:
    top-k: 5
    # 측정으로 정한 값이다. 관련 질문 6건은 0.345~0.554, 무관 질문 4건은 0.142~0.352 에
    # 분포해 구간이 겹친다. 단일 임계값으로 완전 분리가 안 되므로 회수율을 택했다 —
    # 검색이 놓친 근거는 프롬프트로 살릴 수 없지만, 새어 든 무관 근거는
    # 시스템 프롬프트의 거절 규칙이 2차로 걸러낸다.
    threshold: 0.32
  memory:
    max-messages: 20
  fallback:
    model: gpt-4o          # 주 모델(gpt-4o-mini)과 다른 모델이어야 의미가 있다
  recovery:
    claim-window-days: 14   # 정책 문서(item-recovery-policy.md)와 같은 값을 유지한다
  agent:
    max-tool-calls: 8       # 한 요청에서 허용하는 도구 호출 수. 넘으면 끊는다

server:
  port: 8081          # 8080 은 다른 앱이 점유할 수 있어 분리한다

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.skala: DEBUG
